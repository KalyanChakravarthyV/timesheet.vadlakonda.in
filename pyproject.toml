[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "timesheet-vadlakonda"
version = "0.1.0"
description = "Django timesheet app with Supabase PostgreSQL, Alembic, Excel export, and multi-provider email"
requires-python = ">=3.12"
dependencies = [
    # Core
    "Django==5.1.4",
    "djangorestframework==3.15.2",
    "django-cors-headers==4.6.0",
    "django-filter==24.3",
    "psycopg2-binary==2.9.10",
    "python-decouple==3.8",
    "dj-database-url==2.3.0",
    # Alembic
    "alembic==1.14.0",
    "SQLAlchemy==2.0.36",
    # Excel
    "openpyxl==3.1.5",
    "xlsxwriter==3.2.0",
    # Email
    "sendgrid==6.11.0",
    "resend==2.5.1",
    # Utilities
    "celery==5.4.0",
    "redis==5.2.1",
    "django-celery-beat==2.7.0",
    "Pillow==11.1.0",
    "python-dateutil==2.9.0.post0",
    "pytz==2024.2",
]

[project.optional-dependencies]
dev = [
    "flake8",
    "black",
    "isort",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "timesheets*"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.flake8]
max-line-length = 100
exclude = ["migrations", "venv", ".venv"]
