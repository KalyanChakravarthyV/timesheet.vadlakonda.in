{% load humanize %}
<div class="bg-white rounded-xl border border-slate-200 p-5">
  <p class="text-xs font-medium text-slate-500 uppercase tracking-wide mb-1">{{ label }}</p>
  <p class="text-2xl font-bold
    {% if color == 'blue' %}text-brand-700
    {% elif color == 'green' %}text-green-700
    {% elif color == 'purple' %}text-purple-700
    {% else %}text-orange-600{% endif %}">
    {% if prefix %}{{ prefix }}{% endif %}{{ value|floatformat:2 }}{% if suffix %}{{ suffix }}{% endif %}
  </p>
</div>
