{% extends "ui/base.html" %}
{% block title %}{% if project %}Edit Project{% else %}New Project{% endif %}{% endblock %}
{% block page_title %}{% if project %}Edit Project{% else %}New Project{% endif %}{% endblock %}

{% block content %}
<div class="max-w-xl">
  <div class="bg-white rounded-xl border border-slate-200 p-6">
    <form method="post" class="space-y-5">
      {% csrf_token %}

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Project Name <span class="text-red-500">*</span></label>
        <input type="text" name="name" value="{{ form.name.value|default:'' }}" required
               class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand-500" />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Client</label>
        <select name="client" class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand-500">
          <option value="">No client</option>
          {% for c in clients %}
          <option value="{{ c.id }}" {% if form.client.value|stringformat:"s" == c.id|stringformat:"s" %}selected{% endif %}>{{ c.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Description</label>
        <textarea name="description" rows="2"
                  class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand-500 resize-none">{{ form.description.value|default:'' }}</textarea>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Status</label>
          <select name="status" class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand-500">
            {% for val, label in status_choices %}
            <option value="{{ val }}" {% if form.status.value == val %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Color</label>
          <input type="color" name="color" value="{{ form.color.value|default:'#3B82F6' }}"
                 class="w-full h-10 rounded-lg border border-slate-300 cursor-pointer" />
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Default Hourly Rate ($)</label>
          <input type="number" name="default_hourly_rate" step="0.01" min="0"
                 value="{{ form.default_hourly_rate.value|default:'0' }}"
                 class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Budget Hours</label>
          <input type="number" name="budget_hours" step="0.5" min="0"
                 value="{{ form.budget_hours.value|default:'' }}" placeholder="Optional"
                 class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand-500" />
        </div>
      </div>

      <div class="flex items-center gap-3 pt-2">
        <button type="submit" class="px-5 py-2.5 bg-brand-600 hover:bg-brand-700 text-white text-sm font-semibold rounded-lg transition">
          {% if project %}Save Changes{% else %}Create Project{% endif %}
        </button>
        <a href="{% url 'ui:project_list' %}" class="px-5 py-2.5 border border-slate-300 text-slate-600 text-sm rounded-lg hover:bg-slate-50 transition">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
