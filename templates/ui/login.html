{% extends "ui/base.html" %}
{% block title %}Sign In{% endblock %}

{% block auth_content %}
<div class="min-h-screen bg-gradient-to-br from-brand-900 to-brand-700 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8">

    <div class="text-center mb-8">
      <div class="text-4xl mb-3">⏱</div>
      <h1 class="text-2xl font-bold text-slate-800">Timesheet</h1>
      <p class="text-slate-500 text-sm mt-1">{{ company_name }}</p>
    </div>

    {% if form.errors %}
    <div class="mb-4 px-4 py-3 bg-red-50 border border-red-200 rounded-lg text-sm text-red-700">
      Invalid username or password.
    </div>
    {% endif %}

    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Username</label>
        <input type="text" name="username" autofocus required
               class="w-full px-3 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
        <input type="password" name="password" required
               class="w-full px-3 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent" />
      </div>
      <input type="hidden" name="next" value="{{ next }}" />
      <button type="submit"
              class="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold py-2.5 rounded-lg text-sm transition">
        Sign In
      </button>
    </form>
  </div>
</div>
{% endblock %}
